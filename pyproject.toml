[project]
name = "flyin"
version = "2.0.0"
description = "Test your 42 Fly-In algorithm on 130 maps and watch it in a visualizer (menu, command line and library)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
visual = ["pygame-ce>=2.5"]

[project.scripts]
flyin = "flyin.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flyin", "flyin.tester", "flyin.visual", "flyin.visual.gui"]

[tool.setuptools.package-data]
flyin = ["maps/**/*.txt", "maps/manifest.json"]
"flyin.visual" = ["assets/fonts/*"]

[tool.mypy]
strict = true
exclude = ["examples/", "adapters/", "build/"]

