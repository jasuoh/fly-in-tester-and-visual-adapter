name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install pygame-ce flake8 mypy
      - name: Lint
        run: |
          python -m flake8 .
          python -m mypy .
      - name: Tests
        env:
          SDL_VIDEODRIVER: dummy
        run: python -m unittest discover -s tests -t . -v
